name: Models probe
on:
  workflow_dispatch:
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Call GitHub Models
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body='{"model":"openai/gpt-4.1-mini","temperature":0,"messages":[{"role":"user","content":"Reply with the word pong."}]}'
          for url in https://models.github.ai/inference/chat/completions https://models.github.ai/catalog/models; do
            echo "== $url"
            curl -sS -m 30 -D - -o body.txt -X POST "$url" -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "$body" | head -20 || true
            head -c 600 body.txt; echo
          done
          echo "== catalog GET"; curl -sS -m 30 -D - -o cat.txt https://models.github.ai/catalog/models -H "Authorization: Bearer $TOKEN" | head -12; head -c 300 cat.txt; echo
